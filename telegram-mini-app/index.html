<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>ИИ-консультант</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--tg-theme-bg-color, #ffffff);
    }
    body {
      min-height: var(--tg-viewport-stable-height, 100vh);
      overflow: hidden;
    }
    #fallback {
      min-height: var(--tg-viewport-stable-height, 100vh);
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .fallback-card {
      max-width: 420px;
      padding: 28px;
      border-radius: 20px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }
    .fallback-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .fallback-text {
      opacity: .72;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="fallback" hidden>
    <div class="fallback-card">
      <div class="fallback-title">ИИ-консультант</div>
      <div class="fallback-text">Откройте приложение через Telegram.</div>
    </div>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (!tg) {
        document.getElementById("fallback").hidden = false;
        return;
      }

      tg.ready();
      tg.expand();

      try {
        tg.setHeaderColor("bg_color");
        tg.setBackgroundColor("bg_color");
      } catch (_) {}

      // Existing Avatrix/Golova consultant.
      window.GolovaConfig = {
        tenant: "9af56f0e-5652-474b-b4da-6938a1d80bc7"
      };
    })();
  </script>

  <script src="https://cabinet.avatrix.ai/embed.js" async></script>
</body>
</html>
